        />

    </head>

        <nav class="topnav">
            <a href="todo.html" class="topnav-segment topnav-todo">

                <span class="topnav-segment-label">OBLIGATIONS</span>

            <span class="topnav-segment topnav-add">

                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                <a href="index.html" class="topnav-home-tab">HOME</a>

            <a href="calendar.html" class="topnav-segment topnav-cal">
                <svg viewBox="0 0 24 24" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">

                </svg>
                <span class="topnav-segment-label">CALENDAR</span>

            <a href="notes.html" class="topnav-segment topnav-notes">
                <svg viewBox="0 0 24 24" fill="#1f2937" xmlns="http://www.w3.org/2000/svg">

                </svg>
                <span class="topnav-segment-label">NOTES</span>
            </a>
        </nav>

        <header class="section-header section-header-oblig">
            <h1>OBLIGATIONS</h1>
        </header>

        <main class="section-content">
            <section id="obligations-panel" class="panel-content" style="padding:0">
                <div class="priority-group">
                    <form
                        id="obligation-actions-form"
                        class="obligation-entry-form"
                    >
                        <input id="obligation-item-input" type="text" />
                        <div class="obligation-action-row">
                            <button
                                id="urgent-btn"
                                class="obligation-action-btn obligation-btn-urgent"
                                type="button"
                                data-obligation="urgent"
                                aria-label="Dodaj u Hitno"
                                title="Dodaj u Hitno"
                            ></button>
                            <button
                                id="important-btn"
                                class="obligation-action-btn obligation-btn-important"
                                type="button"
                                data-obligation="important"
                                aria-label="Dodaj u Važno"
                                title="Dodaj u Važno"
                            ></button>
                            <button
                                id="wait-btn"
                                class="obligation-action-btn obligation-btn-wait"
                                type="button"
                                data-obligation="wait"
                                aria-label="Dodaj u Može da sačeka"
                                title="Dodaj u Može da sačeka"
                            ></button>
                            <button
                                id="obligation-delete-mode-btn"
                                class="obligation-action-btn obligation-btn-delete-mode"
                                type="button"
                                data-delete-mode-toggle="true"
                                aria-label="Uključi brisanje"
                                title="Uključi brisanje"
                            >
                                X
                            </button>
                        </div>
                    </form>
                    <h3 class="p-high">Hitno</h3>
                    <ul id="obligations-urgent" class="dot-list"></ul>
                </div>

                <div class="priority-group">
                    <h3 class="p-mid">Važno</h3>
                    <ul id="obligations-important" class="dot-list"></ul>
                </div>

                <div class="priority-group">
                    <h3 class="p-low">Može da sačeka</h3>
                    <ul id="obligations-wait" class="dot-list"></ul>
                </div>
            </section>
        </main>

        <nav class="bottombar" aria-label="Mobilna navigacija">
            <a href="todo.html" class="bottombar-segment bottombar-todo">
                <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
                    <rect x="4" y="4" width="16" height="16" rx="1"/>
                </svg>
            </a>
            <a href="obligations.html" class="bottombar-segment bottombar-oblig active">
                <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="12,3 22,21 2,21"/>
                </svg>
            </a>
            <a href="index.html" class="bottombar-segment bottombar-add">
                <svg viewBox="0 0 24 24" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </a>
            <a href="calendar.html" class="bottombar-segment bottombar-cal">
                <svg viewBox="0 0 24 24" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">
                    <line x1="6" y1="6" x2="18" y2="18"/>
                    <line x1="18" y1="6" x2="6" y2="18"/>
                </svg>
            </a>
            <a href="notes.html" class="bottombar-segment bottombar-notes">
                <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="8"/>
                </svg>
            </a>
        </nav>

        <script src="./obligations.js"></script>
    </body>
</html>
